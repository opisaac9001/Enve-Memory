name: Feature request
description: An idea that would make Enve Memory more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the principles
      options:
        - label: Works without an account or a cloud service
        - label: Still useful with AI turned off
