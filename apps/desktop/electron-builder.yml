appId: com.enve.memory
productName: Enve Memory
copyright: Copyright © 2026 Enve Media. AGPL-3.0-only.
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist/main.js
  - dist/preload.cjs
  - dist/cli.mjs
  - dist/renderer/**
  - "!**/*.map"
  # transformers inlines onnxruntime-web for Node; only onnxruntime-node's binaries are loaded.
  - "!node_modules/onnxruntime-web/**"
  # onnxruntime-node carries binaries for every OS; keep the one being packaged.
  - "!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**"
extraResources:
  - from: resources/cli.mjs
    to: cli.mjs
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
# Every native dependency ships N-API prebuilds, so there's nothing to rebuild against Electron's ABI.
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    # onnxruntime-node 1.30 ships no darwin-x64 binary, so Intel Macs aren't a target yet.
    - target: dmg
      arch: [arm64]
  # Ad-hoc signature: no Apple Developer ID, but a valid seal, which Apple Silicon needs to launch the app at all.
  # For distribution, set CSC_NAME/CSC_LINK, enable hardenedRuntime and notarize.
  identity: '-'
  hardenedRuntime: false
dmg:
  title: Enve Memory
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  synopsis: Shared memory for you and your AI tools
  maintainer: Enve Media
